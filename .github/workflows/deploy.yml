name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for the Pages environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Hardcoded rather than read from repo variables: the variables API is not
      # reachable for this owner, and an empty value here means every asset URL
      # loses its /inventislabs-earthquake prefix and 404s on Pages.
      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /inventislabs-earthquake
          NEXT_PUBLIC_SITE_URL: https://shashank2577.github.io/inventislabs-earthquake

      # enablement: true is required on a repo that has never had Pages on.
      # Without it the action defaults to false and fails with "Get Pages site
      # failed" instead of creating the site.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4